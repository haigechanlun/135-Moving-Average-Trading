[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "njm135"
version = "0.2.0"
description = "宁俊明 135 战法：Binance 行情 + Gate 实盘"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
live = ["gate-api>=6.0"]

[project.scripts]
njm135 = "njm135.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
